<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new financial transaction to your tracker.">
    <title>Add Transaction - Student Finance Tracker</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>

<body>

    <!-- Skip Link for Accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="app-header">
        <div class="container">
            <div class="logo">
                <h1>Finance<span class="text-primary">Tracker</span></h1>
            </div>
            <nav class="main-nav" aria-label="Main Navigation">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="records.html">Records</a></li>
                    <li><a href="add.html" class="active" aria-current="page">Add</a></li>
                    <li><a href="settings.html">Settings</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section id="add-transaction" class="section">
            <div class="container">
                <div class="form-card">
                    <header class="form-header">
                        <h2>Add Transaction</h2>
                    </header>
                    <form id="transaction-form" novalidate>
                        <div class="form-group">
                            <label for="description">Description (no leading/trailing spaces)</label>
                            <input type="text" id="description" name="description" required
                                aria-describedby="desc-help">
                            <span id="desc-help" class="form-text">e.g., "Coffee with friends"</span>
                        </div>

                        <div class="row">
                            <div class="form-group col">
                                <label for="amount">Amount</label>
                                <input type="number" id="amount" name="amount" step="0.01" min="0" required>
                            </div>
                            <div class="form-group col">
                                <label for="date">Date</label>
                                <input type="date" id="date" name="date" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" required>
                                <option value="" disabled selected>Select a category</option>
                                <option value="Food">Food</option>
                                <option value="Books">Books</option>
                                <option value="Transport">Transport</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Fees">Fees</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Add Transaction</button>
                            <button type="reset" class="btn btn-secondary">Clear</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2026 Student Finance Tracker. All rights reserved.</p>
        </div>
    </footer>
    <script src="scripts/storage.js"></script>
    <script src="scripts/add.js"></script>
</body>

</html>
